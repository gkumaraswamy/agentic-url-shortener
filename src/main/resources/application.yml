server:
  port: 8080

spring:
  application:
    name: agentic-url-shortener
  datasource:
    url: jdbc:h2:mem:shortenerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  base-url: http://localhost:8080/
  default-ttl-days: 30